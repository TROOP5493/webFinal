<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Weightlifting</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email address:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="mt-3">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <script>
        // Firebase initialization
        const firebaseConfig = {
            apiKey: "AIzaSyDWxrVbi3jUFiDMnlVFdgDRNZlbnFU2qo4",
            authDomain: "webfinal-fbc7c.firebaseapp.com",
            projectId: "webfinal-fbc7c",
            storageBucket: "webfinal-fbc7c.firebasestorage.app",
            messagingSenderId: "1083380210861",
            appId: "1:1083380210861:web:0c7741cf8cb79484d13a24",
            measurementId: "G-HLM6E7R572"
        };
        firebase.initializeApp(firebaseConfig);

        // Check if the user is already logged in
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                console.log('Already logged in:', user); // Debug log
                window.location.href = "index.html";
            }
        });

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(userCredential => {
                    console.log('User logged in:', userCredential.user);  // Debug log
                    window.location.href = "index.html";
                })
                .catch(error => {
                    console.error('Login failed:', error.message);  // Debug log
                    const errorMessage = error.message;
                    alert(errorMessage); // Display error message if login fails
                });
        });
    </script>
</body>
</html>
