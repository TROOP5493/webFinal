<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weightlifting</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">

    <!-- Firebase SDK Scripts with type="module" -->
    <script type="module">
        // Firebase App (this is always required)
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDWxrVbi3jUFiDMnlVFdgDRNZlbnFU2qo4",
            authDomain: "webfinal-fbc7c.firebaseapp.com",
            projectId: "webfinal-fbc7c",
            storageBucket: "webfinal-fbc7c.firebasestorage.app",
            messagingSenderId: "1083380210861",
            appId: "1:1083380210861:web:0c7741cf8cb79484d13a24",
            measurementId: "G-HLM6E7R572"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Handle logout
        function logout() {
            signOut(auth)
                .then(() => {
                    // Redirect to login page after logout
                    window.location.href = "login.html";
                })
                .catch(error => {
                    // Error handling
                    console.error('Logout failed:', error.message);
                    alert(error.message);
                });
        }

        // Listen for auth state changes
        onAuthStateChanged(auth, user => {
            if (!user) {
                // If user is not logged in, redirect to the login page
                window.location.href = "login.html";
            }
        });

        // Export logout function to be used in HTML
        window.logout = logout;
    </script>
</head>
<body>
    <div class="container">
        <h1>Welcome to Weightlifting</h1>
        <p>This is the main content.</p>

        <!-- Logout Button -->
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
</body>
</html>
