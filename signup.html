<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - Weightlifting</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="mt-5">Sign Up</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email address:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <p class="mt-3">Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <script>
        // Firebase initialization
        const firebaseConfig = {
            apiKey: "AIzaSyDWxrVbi3jUFiDMnlVFdgDRNZlbnFU2qo4",
            authDomain: "webfinal-fbc7c.firebaseapp.com",
            projectId: "webfinal-fbc7c",
            storageBucket: "webfinal-fbc7c.firebasestorage.app",
            messagingSenderId: "1083380210861",
            appId: "1:1083380210861:web:0c7741cf8cb79484d13a24",
            measurementId: "G-HLM6E7R572"
        };
        firebase.initializeApp(firebaseConfig);

        // Handle sign-up form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            firebase.auth().createUserWithEmailAndPassword(email, password)
                .then(userCredential => {
                    // Signed up successfully, redirect to index.html
                    window.location.href = "index.html";
                })
                .catch(error => {
                    const errorMessage = error.message;
                    alert(errorMessage); // Display error message if signup fails
                });
        });
    </script>
</body>
</html>
